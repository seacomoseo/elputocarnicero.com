  - title: Andrea M.
    md: |
      Tatuajero y persona de 10!

      Es un gran profesional, te asesora en todo momento y te ayuda para que tu tatuaje sea único y se adapte 100% a la zona!

      Además la curación genial, los colores han quedado super planos y uniformes!!
  - title: Morris
    md: |
      Ya es el décimo tatuaje que me hago con él, calidad increíble y trato personalizado, atento y amable.

      Recomiendo al 100% a este tatuador el cual es el mejor que conozco en la Region y España.
  - title: Rubén M.
    md: |
      Un gran profesional, te ofrece la posibilidad de diseñarte un tattoo personalizado, dándole las nociones de lo que sientes o quieres expresar a través del dibujo.

      Unos tatuajes con mucha calidad y no solo en estilo neotradi que es su especialidad más destacada, si no también en la elaboración de realismos y he de decir que siendo una de las disciplinas de tatuaje más complicadas (desde mi punto de vista), este tatuador está a la altura de obras que me impresionaron mucho.

      Recomendado!!!

      Os lo recomiendo!!!
