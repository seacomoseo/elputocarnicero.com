    md: |
      Ahora mismo estoy sentado con él y se comía un caldo con pelotas.

      Muy normal para el nombre que lleva.

      Esperaba un macarra un tío duro.

      Pero se tomó una manzanilla.

      Volveré para repetir.
  - title: Fran N.
    md: |
